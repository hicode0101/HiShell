name: Release

# 推送 v* 标签自动打包四平台并发布 Release：
#   git tag v0.2.0 && git push origin v0.2.0
# 也支持手动触发（workflow_dispatch，填入版本号，如 0.2.0）
#
# 版本号以 tag 为准：构建前自动把 tag 版本同步进 package.json /
# src-tauri/tauri.conf.json / src-tauri/Cargo.toml（scripts/sync-version.mjs）。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.2.0，不带 v 前缀）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest # Windows x64（NSIS + MSI）
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04 # Linux x64（AppImage + deb）
            target: x86_64-unknown-linux-gnu
          - platform: macos-latest # macOS Apple Silicon（M 系列，arm64）
            target: aarch64-apple-darwin
          - platform: macos-13 # macOS Intel（x86_64）
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Sync version with tag
        shell: bash
        run: node scripts/sync-version.mjs "${{ steps.version.outputs.version }}"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install Linux dependencies (webkit2gtk-4.1 等)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libayatana-appindicator3-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build & Release (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 产物标识与 Release 名（__VERSION__ 由 tauri-action 以 tauri.conf 中的版本替换，
          # 该版本已在上方与 tag 同步）
          tagName: v${{ steps.version.outputs.version }}
          releaseName: 'HiShell v__VERSION__'
          releaseBody: 'HiShell 跨平台 SSH 客户端 ${{ github.ref_name }}。安装包见下方 Assets。'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
