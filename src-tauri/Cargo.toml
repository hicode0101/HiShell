[package]
name = "hishell"
version = "1.0.2"
description = "HiShell — An SSH terminal tool favored by white-hat hackers."
authors = ["HiShell"]
edition = "2021"

[lib]
name = "hishell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
once_cell = "1"

# SSH / SFTP / 网络
russh = "0.46"
russh-sftp = "2"
tokio = { version = "1", features = ["full"] }
tokio-socks = "0.5"
base64 = "0.22"
thiserror = "2"
async-trait = "0.1"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
portable-pty = "0.8"
serde_yaml = "0.9"
sha2 = "0.10"

# SSH 用户密钥生成（与 russh-keys 同源 RustCrypto 生态）
ssh-key = { version = "0.6", features = ["ed25519", "p256", "p384", "p521", "rsa", "encryption", "getrandom"] }
rsa = "0.9"
ed25519-dalek = "2"
rand = "0.8"

# debug 构建也对依赖开优化：RSA 大密钥生成在无优化下慢到不可用
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
