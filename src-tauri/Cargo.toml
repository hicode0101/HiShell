[package]
name = "hishell"
version = "0.1.0"
description = "HiShell — Win11 Fluent 风格 SSH 客户端"
authors = ["HiShell"]
edition = "2021"

[lib]
name = "hishell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
once_cell = "1"

# SSH / SFTP / 网络
russh = "0.46"
russh-sftp = "2"
tokio = { version = "1", features = ["full"] }
tokio-socks = "0.5"
base64 = "0.22"
thiserror = "2"
async-trait = "0.1"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
